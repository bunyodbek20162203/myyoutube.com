<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyYouTube</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
        }
        body {
            background-color: #0f0f0f;
            color: #f1f1f1;
        }
        /* Yuqori panel (Navbar) */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 56px;
            background-color: #0f0f0f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
            border-bottom: 1px solid #272727;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .menu-btn {
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
        }
        .menu-btn:hover { background-color: #272727; }
        .logo {
            display: flex;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: -0.5px;
        }
        .logo-icon {
            background-color: #ff0000;
            color: white;
            padding: 2px 8px;
            border-radius: 6px;
            margin-right: 5px;
            font-size: 14px;
        }
        /* Qidiruv qismi */
        .nav-center {
            display: flex;
            align-items: center;
            width: 45%;
            max-width: 600px;
        }
        .search-input {
            width: 100%;
            height: 40px;
            background-color: #121212;
            border: 1px solid #303030;
            border-radius: 20px 0 0 20px;
            padding: 0 16px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .search-input:focus { border-color: #1c62b9; }
        .search-btn {
            height: 40px;
            padding: 0 20px;
            background-color: #222222;
            border: 1px solid #303030;
            border-left: none;
            border-radius: 0 20px 20px 0;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
        .search-btn:hover { background-color: #303030; }
        /* Video yuklash tugmasi */
        .upload-btn {
            background-color: #272727;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }
        .upload-btn:hover { background-color: #3f3f3f; }

        /* Asosiy tana qismi */
        .main-wrapper {
            display: flex;
            margin-top: 56px;
        }
        /* Chap menyu (Sidebar) */
        aside {
            width: 220px;
            position: fixed;
            top: 56px;
            bottom: 0;
            background-color: #0f0f0f;
            padding: 12px;
            overflow-y: auto;
        }
        .side-item {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }
        .side-item:hover, .side-item.active { background-color: #272727; font-weight: bold; }
        hr { border: none; border-top: 1px solid #272727; margin: 12px 0; }

        /* Kontent hududi */
        .content {
            margin-left: 220px;
            padding: 20px;
            width: calc(100% - 220px);
        }
        /* Kategoriyalar */
        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
        }
        .cat-chip {
            background-color: #272727;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        .cat-chip.active { background-color: #f1f1f1; color: #0f0f0f; font-weight: 500; }

        /* Videolar setkasi (Grid) */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 20px;
        }
        .video-card {
            cursor: pointer;
            transition: transform 0.2s;
        }
        .thumbnail-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            background-color: #202020;
        }
        .thumbnail-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-details {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #ff0000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .video-meta h4 {
            font-size: 15px;
            line-height: 1.3;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-meta p { font-size: 13px; color: #aaaaaa; }

        /* Video ko'rish sahifasi (Watch Mode) */
        .watch-container {
            display: none;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }
        .player-box iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            border: none;
        }
        .watch-title { font-size: 20px; margin: 14px 0; }
        .watch-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid #272727;
            flex-wrap: wrap;
            gap: 10px;
        }
        .channel-box { display: flex; align-items: center; gap: 12px; }
        .sub-btn {
            background-color: #f1f1f1;
            color: #0f0f0f;
            border: none;
            padding: 9px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
        }
        .sub-btn.subscribed { background-color: #272727; color: #f1f1f1; }
        .action-btns { display: flex; gap: 10px; }
        .pill-btn {
            background-color: #272727;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        .pill-btn:hover { background-color: #3f3f3f; }

        /* Izohlar qismi */
        .comments-section { margin-top: 20px; }
        .comment-input-box { display: flex; gap: 10px; margin: 15px 0; }
        .comment-input-box input {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 1px solid #303030;
            color: white;
            padding: 8px;
            outline: none;
        }
        .comment-item { margin-bottom: 12px; font-size: 14px; background: #181818; padding: 10px; border-radius: 8px; }

        /* Modal (Video qo'shish oynasi) */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        .modal-box {
            background: #212121;
            padding: 24px;
            border-radius: 12px;
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .modal-box input, .modal-box select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #121212;
            color: white;
        }
        @media (max-width: 850px) {
            aside { display: none; }
            .content { margin-left: 0; width: 100%; }
            .watch-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-left">
            <div class="menu-btn" onclick="boshSahifaga()">☰</div>
            <div class="logo" onclick="boshSahifaga()">
                <span class="logo-icon">▶</span> MyYouTube
            </div>
        </div>
        <div class="nav-center">
            <input type="text" class="search-input" id="searchInput" placeholder="Qidirish..." onkeyup="qidirish()">
            <button class="search-btn" onclick="qidirish()">🔍</button>
        </div>
        <button class="upload-btn" onclick="modalOch()">➕ Video qo'shish</button>
    </header>

    <div class="main-wrapper">
        <aside>
            <div class="side-item active" onclick="boshSahifaga()">🏠 Asosiy</div>
            <div class="side-item" onclick="kategoriyaTanla('Dasturlash')">💻 Dasturlash</div>
            <div class="side-item" onclick="kategoriyaTanla('O\'yinlar')">🎮 O'yinlar</div>
            <div class="side-item" onclick="kategoriyaTanla('Musiqa')">🎵 Musiqa</div>
            <hr>
            <div class="side-item" onclick="modalOch()">📤 Video yuklash</div>
        </aside>

        <div class="content">
            <!-- Bosh sahifa ko'rinishi -->
            <div id="homeView">
                <div class="categories">
                    <div class="cat-chip active" onclick="kategoriyaTanla('Barchasi', this)">Barchasi</div>
                    <div class="cat-chip" onclick="kategoriyaTanla('Dasturlash', this)">Dasturlash</div>
                    <div class="cat-chip" onclick="kategoriyaTanla('Robototexnika', this)">Robototexnika</div>
                    <div class="cat-chip" onclick="kategoriyaTanla('O\'yinlar', this)">O'yinlar</div>
                    <div class="cat-chip" onclick="kategoriyaTanla('Musiqa', this)">Musiqa</div>
                </div>
                <div class="video-grid" id="videoGrid"></div>
            </div>

            <!-- Video ko'rish sahifasi -->
            <div class="watch-container" id="watchView">
                <div class="player-box">
                    <iframe id="mainPlayer" src="" allowfullscreen></iframe>
                    <h2 class="watch-title" id="watchTitle">Video nomi</h2>
                    <div class="watch-actions">
                        <div class="channel-box">
                            <div class="avatar" id="watchAvatar">M</div>
                            <div>
                                <div id="watchChannel" style="font-weight: bold;">Kanal nomi</div>
                                <div style="font-size: 12px; color: #aaa;">125K obunachi</div>
                            </div>
                            <button class="sub-btn" id="subBtn" onclick="obunaBolish()">Obuna bo'lish</button>
                        </div>
                        <div class="action-btns">
                            <button class="pill-btn" onclick="laykBosish()">👍 <span id="likeCount">120</span></button>
                            <button class="pill-btn" onclick="ulashish()">↗️ Ulashish</button>
                        </div>
                    </div>

                    <div class="comments-section">
                        <h3>Izohlar</h3>
                        <div class="comment-input-box">
                            <input type="text" id="commentInput" placeholder="Izoh yozing...">
                            <button class="pill-btn" onclick="izohQoshish()">Yuborish</button>
                        </div>
                        <div id="commentsList"></div>
                    </div>
                </div>

                <div>
                    <h4 style="margin-bottom: 12px;">Tavsiya etilgan videolar</h4>
                    <div id="relatedVideos" style="display: flex; flex-direction: column; gap: 14px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Yangi video qo'shish oynasi -->
    <div class="modal" id="uploadModal">
        <div class="modal-box">
            <h3>Yangi video qo'shish</h3>
            <input type="text" id="newUrl" placeholder="YouTube havolasi (masalan: https://youtu.be/...)">
            <input type="text" id="newTitle" placeholder="Video sarlavhasi">
            <input type="text" id="newChannel" placeholder="Kanal nomi">
            <select id="newCategory">
                <option value="Dasturlash">Dasturlash</option>
                <option value="Robototexnika">Robototexnika</option>
                <option value="O'yinlar">O'yinlar</option>
                <option value="Musiqa">Musiqa</option>
            </select>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button class="pill-btn" onclick="modalYop()">Bekor qilish</button>
                <button class="pill-btn" style="background: #ff0000;" onclick="yangiVideoSaqla()">Qo'shish</button>
            </div>
        </div>
    </div>

    <script>
        // Boshlang'ich videolar ro'yxati
        const defaultVideos = [
            { id: "jfKfPfyJRdk", title: "Lofi Hip Hop Radio - Dasturlash va o'qish uchun", channel: "Lofi Girl", views: "45K tomosha", category: "Musiqa", likes: 840 },
            { id: "rfscVS0vtbw", title: "Python Dasturlash Tili - To'liq Kurs", channel: "Code Academy", views: "1.2M tomosha", category: "Dasturlash", likes: 5400 },
            { id: "1nO262221nQ", title: "Arduino va Robototexnika Loyihalari", channel: "RoboTech", views: "89K tomosha", category: "Robototexnika", likes: 920 },
            { id: "aqz-KE-bpKQ", title: "Big Buck Bunny - 4K Animatsiya Filmi", channel: "Blender Studio", views: "10M tomosha", category: "O'yinlar", likes: 12000 }
        ];

        // Brauzer xotirasidan videolarni olish
        let videos = JSON.parse(localStorage.getItem("myYoutubeVideos")) || defaultVideos;
        let currentVideo = null;

        function videolarniChizish(list) {
            const grid = document.getElementById("videoGrid");
            grid.innerHTML = "";
            list.forEach(v => {
                const card = document.createElement("div");
                card.className = "video-card";
                card.onclick = () => videoOchish(v);
                card.innerHTML = `
                    <div class="thumbnail-box">
                        <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="${v.title}">
                    </div>
                    <div class="video-details">
                        <div class="avatar">${v.channel[0].toUpperCase()}</div>
                        <div class="video-meta">
                            <h4>${v.title}</h4>
                            <p>${v.channel}</p>
                            <p>${v.views} • ${v.category}</p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function videoOchish(video) {
            currentVideo = video;
            document.getElementById("homeView").style.display = "none";
            document.getElementById("watchView").style.display = "grid";
            document.getElementById("mainPlayer").src = `https://www.youtube.com/embed/${video.id}?autoplay=1`;
            document.getElementById("watchTitle").innerText = video.title;
            document.getElementById("watchChannel").innerText = video.channel;
            document.getElementById("watchAvatar").innerText = video.channel[0].toUpperCase();
            document.getElementById("likeCount").innerText = video.likes || 100;
            document.getElementById("commentsList").innerHTML = "";
            window.scrollTo(0, 0);

            // O'ng tomondagi tavsiya videolar
            const related = document.getElementById("relatedVideos");
            related.innerHTML = "";
            videos.filter(item => item.id !== video.id).forEach(item => {
                const div = document.createElement("div");
                div.style.cssText = "display:flex; gap:10px; cursor:pointer;";
                div.onclick = () => videoOchish(item);
                div.innerHTML = `
                    <img src="https://img.youtube.com/vi/${item.id}/mqdefault.jpg" style="width:150px; border-radius:8px;">
                    <div>
                        <div style="font-size:14px; font-weight:bold; margin-bottom:4px;">${item.title}</div>
                        <div style="font-size:12px; color:#aaa;">${item.channel}</div>
                    </div>
                `;
                related.appendChild(div);
            });
        }

        function boshSahifaga() {
            document.getElementById("watchView").style.display = "none";
            document.getElementById("homeView").style.display = "block";
            document.getElementById("mainPlayer").src = "";
            videolarniChizish(videos);
        }

        function qidirish() {
            const text = document.getElementById("searchInput").value.toLowerCase();
            boshSahifaga();
            const filtered = videos.filter(v => v.title.toLowerCase().includes(text) || v.channel.toLowerCase().includes(text));
            videolarniChizish(filtered);
        }

        function kategoriyaTanla(cat, el) {
            boshSahifaga();
            if (el) {
                document.querySelectorAll(".cat-chip").forEach(c => c.classList.remove("active"));
                el.classList.add("active");
            }
            if (cat === "Barchasi") {
                videolarniChizish(videos);
            } else {
                videolarniChizish(videos.filter(v => v.category === cat));
            }
        }

        function laykBosish() {
            if (currentVideo) {
                currentVideo.likes = (currentVideo.likes || 100) + 1;
                document.getElementById("likeCount").innerText = currentVideo.likes;
                localStorage.setItem("myYoutubeVideos", JSON.stringify(videos));
            }
        }

        function obunaBolish() {
            const btn = document.getElementById("subBtn");
            btn.classList.toggle("subscribed");
            btn.innerText = btn.classList.contains("subscribed") ? "Obuna bo'lindi ✔" : "Obuna bo'lish";
        }

        function izohQoshish() {
            const inp = document.getElementById("commentInput");
            if (inp.value.trim() === "") return;
            const div = document.createElement("div");
            div.className = "comment-item";
            div.innerHTML = `<strong>Foydalanuvchi:</strong> ${inp.value}`;
            document.getElementById("commentsList").prepend(div);
            inp.value = "";
        }

        function ulashish() {
            alert("Video havolasi nusxalandi: https://youtu.be/" + currentVideo.id);
        }

        function modalOch() { document.getElementById("uploadModal").style.display = "flex"; }
        function modalYop() { document.getElementById("uploadModal").style.display = "none"; }

        function yangiVideoSaqla() {
            const url = document.getElementById("newUrl").value;
            const title = document.getElementById("newTitle").value || "Yangi video";
            const channel = document.getElementById("newChannel").value || "Mening Kanalim";
            const category = document.getElementById("newCategory").value;

            let id = "";
            if (url.includes("v=")) id = url.split("v=")[1].substring(0, 11);
            else if (url.includes("youtu.be/")) id = url.split("youtu.be/")[1].substring(0, 11);

            if (id.length === 11) {
                videos.unshift({ id, title, channel, views: "1 tomosha", category, likes: 1 });
                localStorage.setItem("myYoutubeVideos", JSON.stringify(videos));
                modalYop();
                boshSahifaga();
                document.getElementById("newUrl").value = "";
                document.getElementById("newTitle").value = "";
            } else {
                alert("To'g'ri YouTube havolasini kiriting!");
            }
        }

        // Dastlabki ishga tushirish
        videolarniChizish(videos);
    </script>
</body>
</html>
